apiVersion: v1
kind: Secret
metadata:
  name: order-db-secret
type: Opaque
stringData:
  POSTGRES_DB: orderdb
  POSTGRES_USER: orders
  POSTGRES_PASSWORD: orderpass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-db
spec:
  replicas: 1
  selector:
    matchLabels: {app: order-db}
  template:
    metadata:
      labels: {app: order-db}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          envFrom:
            - secretRef: {name: order-db-secret}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: order-db
spec:
  selector: {app: order-db}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels: {app: order-service}
  template:
    metadata:
      labels: {app: order-service}
    spec:
      containers:
        - name: order
          image: order-service:1.0
          imagePullPolicy: Never
          ports: [{containerPort: 8002}]
          env:
            - name: DATABASE_URL
              value: postgresql://orders:orderpass@order-db:5432/orderdb
            - name: CATALOG_URL
              value: http://catalog-service:8001   # Kubernetes DNS service discovery
          readinessProbe:
            httpGet: {path: /health, port: 8002}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8002}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: NodePort
  selector: {app: order-service}
  ports: [{port: 8002, targetPort: 8002, nodePort: 30002}]
