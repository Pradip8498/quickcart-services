apiVersion: v1
kind: Secret
metadata:
  name: catalog-db-secret
type: Opaque
stringData:
  POSTGRES_DB: catalogdb
  POSTGRES_USER: catalog
  POSTGRES_PASSWORD: catalogpass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-db
spec:
  replicas: 1
  selector:
    matchLabels: {app: catalog-db}
  template:
    metadata:
      labels: {app: catalog-db}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          envFrom:
            - secretRef: {name: catalog-db-secret}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-db
spec:
  selector: {app: catalog-db}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 2
  selector:
    matchLabels: {app: catalog-service}
  template:
    metadata:
      labels: {app: catalog-service}
    spec:
      containers:
      - name: catalog
        image: pradip8498/catalog-service:${BUILD_NUMBER}
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8001
          env:
            - name: DATABASE_URL
              value: postgresql://catalog:catalogpass@catalog-db:5432/catalogdb
          readinessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  type: NodePort
  selector: {app: catalog-service}
  ports: [{port: 8001, targetPort: 8001, nodePort: 30001}]
